#Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4g"
org.gradle.parallel=true
org.gradle.caching=true

#Kotlin
kotlin.code.style=official

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 bans 'com.android.library' + 'org.jetbrains.kotlin.multiplatform' on the same module.
# These two flags keep the legacy (AGP 8 style) behaviour working on AGP 9.
# The long-term fix is migrating :app to the 'com.android.kotlin.multiplatform.library' plugin.
android.builtInKotlin=false
android.newDsl=false

#MPP
kotlin.mpp.enableCInteropCommonization=true

#Compose-ios
org.jetbrains.compose.experimental.uikit.enabled=true

#Compose-web
org.jetbrains.compose.experimental.jscanvas.enabled=true
